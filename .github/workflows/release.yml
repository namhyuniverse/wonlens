# v* 태그를 push 하면 테스트 후 wonlens.zip 을 붙인 GitHub Release 를 만든다.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 태그와 manifest 버전 일치 확인
        run: test "v$(jq -r .version manifest.json)" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: sh scripts/pack.sh
      - name: Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/wonlens.zip --title "$GITHUB_REF_NAME" --generate-notes
